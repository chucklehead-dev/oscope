name: durable-s3-e2e

on:
  workflow_dispatch:
    inputs:
      retain_qualified_synthetic_fixture:
        description: Deliberately reject the qualified synthetic history harness to validate failed artifact replay
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/durable-s3-e2e.yml
      - deps.edn
      - src/oscope/durable_server_main.clj
      - src/oscope/durable_observability.clj
      - src/oscope/embedded.clj
      - src/oscope/embedded/query.clj
      - src/oscope/otlp.clj
      - src/oscope/server.clj
      - test/durable_s3_minio.sh
      - test/durable_crash_reopen.sh
      - test/durable_s3_crash_reopen.sh
      - test/durable_fault_acceptance.sh
      - test/durable_aspect_smoke.sh
      - test/durable_s3_aspect_smoke.sh
      - test/durable-aspect-published/deps.edn
      - test/durable-fault/deps.edn
      - test/durable-fault-published/deps.edn
      - test/durable-process-published/deps.edn
      - test/oscope/durable_crash_verify.clj
      - test/oscope/durable_fault_report_verify.clj
      - test/oscope/durable_fault_server_main.clj
      - test/oscope/durable_fault_verify.clj
      - test/oscope/durable_aspect_test_runner.clj
      - test/oscope/durable_aspect_report_test.clj
      - test/oscope/durable_history_assertions.clj
      - test/oscope/durable_history_assertions_test.clj
      - test/oscope/durable_integration_test.clj
      - test/oscope/durable_s3_aspect_test_runner.clj
      - test/oscope/durable_telemetry_assertions.clj
      - test/oscope/durable_observability_test.clj
      - test/oscope/durable_s3_integration_test.clj
      - test/oscope/durable_test_runner.clj
      - test/oscope/embedded_durable_integration_test.clj
      - test/oscope/embedded_query_test.clj
      - test/oscope/embedded_test.clj
      - test/oscope/server_test.clj
  pull_request:
    paths:
      - .github/workflows/durable-s3-e2e.yml
      - deps.edn
      - src/oscope/durable_server_main.clj
      - src/oscope/durable_observability.clj
      - src/oscope/embedded.clj
      - src/oscope/embedded/query.clj
      - src/oscope/otlp.clj
      - src/oscope/server.clj
      - test/durable_s3_minio.sh
      - test/durable_crash_reopen.sh
      - test/durable_s3_crash_reopen.sh
      - test/durable_fault_acceptance.sh
      - test/durable_aspect_smoke.sh
      - test/durable_s3_aspect_smoke.sh
      - test/durable-aspect-published/deps.edn
      - test/durable-fault/deps.edn
      - test/durable-fault-published/deps.edn
      - test/durable-process-published/deps.edn
      - test/oscope/durable_crash_verify.clj
      - test/oscope/durable_fault_report_verify.clj
      - test/oscope/durable_fault_server_main.clj
      - test/oscope/durable_fault_verify.clj
      - test/oscope/durable_aspect_test_runner.clj
      - test/oscope/durable_aspect_report_test.clj
      - test/oscope/durable_history_assertions.clj
      - test/oscope/durable_history_assertions_test.clj
      - test/oscope/durable_integration_test.clj
      - test/oscope/durable_s3_aspect_test_runner.clj
      - test/oscope/durable_telemetry_assertions.clj
      - test/oscope/durable_observability_test.clj
      - test/oscope/durable_s3_integration_test.clj
      - test/oscope/durable_test_runner.clj
      - test/oscope/embedded_durable_integration_test.clj
      - test/oscope/embedded_query_test.clj
      - test/oscope/embedded_test.clj
      - test/oscope/server_test.clj

permissions:
  contents: read
  actions: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.6
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.6
      MINIO_IMAGE: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
      # Authenticated producer83 tuple; rotate explicitly before artifact expiry.
      QUALIFIED_RUNTIME_REPOSITORY: casselc/jolt
      QUALIFIED_RUNTIME_COMPILER_SOURCE: aea91781bbab68bf174fef4a689bb00dcf834ded
      QUALIFIED_RUNTIME_COMPILER_TREE: a31de1596fcabd0e45fbcbc528842805acea0ee7
      QUALIFIED_RUNTIME_RUN_ID: '35188849252'
      QUALIFIED_RUNTIME_RUN_ATTEMPT: '1'
      QUALIFIED_RUNTIME_ARTIFACT_ID: '10483062488'
      QUALIFIED_RUNTIME_WORKFLOW_SHA: '6bf745bf6101f2c3481d0ffe16401843c7675050'
      QUALIFIED_RUNTIME_ARTIFACT_SHA256: '353670dda1447d96d46aa1e133e4910481caf2f328d159a9bde76ed863e41524'
      QUALIFIED_RUNTIME_BINARY_SHA256: '31cff7ea89a652bd99848cf15686eb576d90d9ac3962ac07701fb6005e6eb458'
      QUALIFIED_RUNTIME_HELPER_SOURCE: https://raw.githubusercontent.com/chucklehead-dev/jolt-otel-clickhouse/c26c9bfcf071112531974729b15469b8c9fe713a/scripts/fetch-qualified-durable-runtime.sh
      QUALIFIED_RUNTIME_HELPER_SHA256: e962976aea263f00440fdf9bfa53c36a158c501f2b87d15aa8a84867fe51caae
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical chDB native qualification
        uses: actions/checkout@v4
        with:
          repository: chucklehead-dev/jolt-chdb
          ref: 19e0ecf9e9f5e2c3f24ac8758f5d6953fd021774
          path: .qualification/jolt-chdb
          persist-credentials: false
      - name: Checkout canonical Durable aspect pack
        uses: actions/checkout@v4
        with:
          repository: chucklehead-dev/jolt-aspect-packs
          ref: 3773a67801bdcbd63c6484f95fa07a4b8afddb72
          path: .qualification/jolt-aspect-packs
          persist-credentials: false
      - name: Checkout aspect-capable Jolt compiler
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: f00bc93bdd8274b14087b74272aadeffb60e0447
          path: .qualification/jolt
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install Jolt v0.8.6
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.6/install \
            | bash -s -- --dir "$install_dir" --version 0.8.6
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        run: test "$(jolt --version)" = "jolt v0.8.6"
      - name: Install aspect compiler linker dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uuid-dev
      - name: Provision pinned Chez for the aspect compiler
        run: make -C .qualification/jolt deps JOLT_SYSTEM_CHEZ=
      - name: Assert aspect compiler version
        run: >-
          test "$(.qualification/jolt/bin/jolt --version)"
          = "jolt v0.8.6-5-gf00bc93b"
      - name: Authenticate and select qualified positive runtime
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/fetch-qualified-durable-runtime.sh"
          curl -fsSL --connect-timeout 15 --max-time 30 "$QUALIFIED_RUNTIME_HELPER_SOURCE" -o "$helper"
          printf '%s  %s\n' "$QUALIFIED_RUNTIME_HELPER_SHA256" "$helper" | sha256sum -c -
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 120s bash "$helper" \
            | tee "$RUNNER_TEMP/oscope-qualified-runtime.log"
          test "$(grep -c '^QUALIFIED_RUNTIME_BIN=' "$RUNNER_TEMP/oscope-qualified-runtime.log")" = 1
          QUALIFIED_RUNTIME_BIN=$(sed -n 's/^QUALIFIED_RUNTIME_BIN=//p' "$RUNNER_TEMP/oscope-qualified-runtime.log")
          [[ "$QUALIFIED_RUNTIME_BIN" =~ ^/tmp/qualified-durable-runtime\.[A-Za-z0-9]+/jolt$ ]]
          test -f "$QUALIFIED_RUNTIME_BIN" && test ! -L "$QUALIFIED_RUNTIME_BIN"
          test "$(realpath "$QUALIFIED_RUNTIME_BIN")" = "$QUALIFIED_RUNTIME_BIN"
          test "$(sha256sum "$QUALIFIED_RUNTIME_BIN" | cut -d ' ' -f1)" = "$QUALIFIED_RUNTIME_BINARY_SHA256"
          # Positive qualifier/SDK/native children use this exact artifact.
          # Woven steps retain their explicit f00 compiler override.
          echo "JOLT_BIN=$QUALIFIED_RUNTIME_BIN" >> "$GITHUB_ENV"
          echo "JOLT_WRAPPER=" >> "$GITHUB_ENV"
          echo "JOLT_CACHE_DIR=$GITHUB_WORKSPACE/.jolt-cache-durable-aea" >> "$GITHUB_ENV"
          dirname "$QUALIFIED_RUNTIME_BIN" >> "$GITHUB_PATH"
      - name: Qualify pinned Durable native ABI and asset
        working-directory: .qualification/jolt-chdb
        run: scripts/qualify-durable-native.sh "$RUNNER_TEMP/chdb-durable"
      - name: Test direct in-process Durable SDK and oscope composition
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
        # Parent bound only; missing final nested receipts remain unconfirmed.
        # A surviving owned reader guardian may retire its leaf up to35s later.
        run: timeout --kill-after=5s 415s jolt -M:test-durable
      - name: Validate renewal-before-release through local woven history
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          JOLT_ASPECT_JOLT: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          JOLT_BIN: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          OSCOPE_DURABLE_ASPECT_BUILD_ALIAS: published
        run: test/durable_aspect_smoke.sh
      - name: Recover oscope through pinned MinIO
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          OSCOPE_DURABLE_S3_TEST_ALIAS: test-durable-s3
        run: test/durable_s3_minio.sh
      - name: Validate ordered privacy-safe Durable history through pinned MinIO
        id: durable_history
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          JOLT_ASPECT_JOLT: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          # Inherit authenticated JOLT_BIN for independently executed readers;
          # JOLT_ASPECT_JOLT alone selects the woven compiler in this gate.
          OSCOPE_DURABLE_ASPECT_BUILD_ALIAS: published
          OSCOPE_DURABLE_EVIDENCE_CONTROL: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_qualified_synthetic_fixture && 'post-qualified-harness-rejection' || 'none' }}
        run: test/durable_s3_aspect_smoke.sh
      - name: Validate owned synthetic failure evidence location
        if: ${{ failure() && steps.durable_history.outcome == 'failure' }}
        id: durable_evidence_location
        shell: bash
        run: |
          set -euo pipefail
          root="${OSCOPE_DURABLE_FAILED_EVIDENCE:?owned evidence location missing}"
          test "$(dirname "$root")" = "$RUNNER_TEMP"
          [[ "$(basename "$root")" =~ ^oscope-durable-evidence-[A-Za-z0-9]{8}$ ]]
          test -d "$root" && test ! -L "$root"
          test "$(realpath "$root")" = "$root"
          test -f "$root/scope" && test ! -L "$root/scope"
          test "$(wc -c < "$root/scope")" -eq 23
          test "$(cat "$root/scope")" = oscope-synthetic-s3-v1
          test -f "$root/capture.status" && test ! -L "$root/capture.status"
          test "$(wc -c < "$root/capture.status")" -le 128
          test "$(wc -l < "$root/capture.status")" -eq 3
          test "$(grep -Fxc 'schema=1' "$root/capture.status")" = 1
          test "$(grep -Ec '^capture=(complete|incomplete)$' "$root/capture.status")" = 1
          test "$(grep -Ec '^original-exit=[0-9]{1,3}$' "$root/capture.status")" = 1
          if [ -e "$root/control.status" ]; then
            test -f "$root/control.status" && test ! -L "$root/control.status"
            test "$(wc -c < "$root/control.status")" -le 128
            test "$(wc -l < "$root/control.status")" = 4
            for field in schema=1 control=post-qualified-harness-rejection qualifying-exit=0 rejection-exit=77; do
              test "$(grep -Fxc "$field" "$root/control.status")" = 1
            done
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            grep -Fxq 'original-exit=77' "$root/capture.status"
          fi
          if [ -e "$root/cleanup.status" ]; then
            test -f "$root/cleanup.status" && test ! -L "$root/cleanup.status"
            test "$(wc -c < "$root/cleanup.status")" -le 256
            test "$(wc -l < "$root/cleanup.status")" -eq 6
            test "$(grep -Fxc 'schema=1' "$root/cleanup.status")" = 1
            test "$(grep -Fxc 'source-qualification=semantic-and-reader-confirmed' "$root/cleanup.status")" = 1
            test "$(grep -Fxc 'cleanup=failed' "$root/cleanup.status")" = 1
            test "$(grep -Ec '^phase=(minio-remove|fixture-delete|path-guard)$' "$root/cleanup.status")" = 1
            test "$(grep -Fxc 'qualifying-exit=0' "$root/cleanup.status")" = 1
            test "$(grep -Ec '^cleanup-exit=[0-9]{1,3}$' "$root/cleanup.status")" = 1
            cleanup_exit=$(sed -n 's/^cleanup-exit=//p' "$root/cleanup.status")
            test "$cleanup_exit" -gt 0 && test "$cleanup_exit" -le 255
            test "$(sed -n 's/^original-exit=//p' "$root/capture.status")" = "$cleanup_exit"
            if ! grep -Fxq 'phase=minio-remove' "$root/cleanup.status"; then
              grep -Fxq 'capture=incomplete' "$root/capture.status"
            fi
          fi
          if grep -Fxq 'capture=complete' "$root/capture.status"; then
            test -f "$root/replay.tar.gz" && test ! -L "$root/replay.tar.gz"
            test -f "$root/replay.sha256" && test ! -L "$root/replay.sha256"
            test "$(wc -c < "$root/replay.tar.gz")" -le 268435456
            test "$(wc -l < "$root/replay.sha256")" -eq 1
            grep -Eq '^[0-9a-f]{64}  replay.tar.gz$' "$root/replay.sha256"
            (cd "$root"; sha256sum -c replay.sha256)
            echo 'capture=complete' >> "$GITHUB_OUTPUT"
          else
            echo 'capture=incomplete' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain failed synthetic Durable history replay evidence
        if: ${{ failure() && steps.durable_evidence_location.outputs.capture == 'complete' }}
        uses: actions/upload-artifact@v4
        with:
          name: durable-history-failed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          # A partial capture uploads only its closed status, not arbitrary
          # files. Missing replay bytes remain a failed gate, never proof.
          path: |
            ${{ env.OSCOPE_DURABLE_FAILED_EVIDENCE }}/replay.tar.gz
            ${{ env.OSCOPE_DURABLE_FAILED_EVIDENCE }}/replay.sha256
            ${{ env.OSCOPE_DURABLE_FAILED_EVIDENCE }}/capture.status
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain incomplete synthetic capture status
        if: ${{ failure() && steps.durable_evidence_location.outputs.capture == 'incomplete' }}
        uses: actions/upload-artifact@v4
        with:
          name: durable-history-incomplete-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OSCOPE_DURABLE_FAILED_EVIDENCE }}/capture.status
            ${{ env.OSCOPE_DURABLE_FAILED_EVIDENCE }}/cleanup.status
            ${{ env.OSCOPE_DURABLE_FAILED_EVIDENCE }}/control.status
          if-no-files-found: error
          retention-days: 7
      - name: Recover oscope after process crashes through pinned MinIO
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          OSCOPE_DURABLE_CRASH_BUILD_ALIAS: test-durable-s3
        run: test/durable_s3_crash_reopen.sh
      - name: Reject definite and ambiguous Durable acknowledgements
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          JOLT_ASPECT_JOLT: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          JOLT_BIN: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          OSCOPE_DURABLE_FAULT_BUILD_ALIAS: published
        run: test/durable_fault_acceptance.sh

name: durable-s3-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/durable-s3-e2e.yml
      - deps.edn
      - src/oscope/durable_server_main.clj
      - src/oscope/durable_observability.clj
      - src/oscope/embedded.clj
      - src/oscope/embedded/query.clj
      - src/oscope/otlp.clj
      - src/oscope/server.clj
      - test/durable_s3_minio.sh
      - test/durable_crash_reopen.sh
      - test/durable_s3_crash_reopen.sh
      - test/durable_fault_acceptance.sh
      - test/durable_aspect_smoke.sh
      - test/durable_s3_aspect_smoke.sh
      - test/durable-aspect-published/deps.edn
      - test/durable-fault/deps.edn
      - test/durable-fault-published/deps.edn
      - test/durable-process-published/deps.edn
      - test/oscope/durable_crash_verify.clj
      - test/oscope/durable_fault_report_verify.clj
      - test/oscope/durable_fault_server_main.clj
      - test/oscope/durable_fault_verify.clj
      - test/oscope/durable_aspect_test_runner.clj
      - test/oscope/durable_aspect_report_test.clj
      - test/oscope/durable_history_assertions.clj
      - test/oscope/durable_history_assertions_test.clj
      - test/oscope/durable_integration_test.clj
      - test/oscope/durable_s3_aspect_test_runner.clj
      - test/oscope/durable_telemetry_assertions.clj
      - test/oscope/durable_observability_test.clj
      - test/oscope/durable_s3_integration_test.clj
      - test/oscope/durable_test_runner.clj
      - test/oscope/embedded_durable_integration_test.clj
      - test/oscope/embedded_query_test.clj
      - test/oscope/embedded_test.clj
      - test/oscope/server_test.clj
  pull_request:
    paths:
      - .github/workflows/durable-s3-e2e.yml
      - deps.edn
      - src/oscope/durable_server_main.clj
      - src/oscope/durable_observability.clj
      - src/oscope/embedded.clj
      - src/oscope/embedded/query.clj
      - src/oscope/otlp.clj
      - src/oscope/server.clj
      - test/durable_s3_minio.sh
      - test/durable_crash_reopen.sh
      - test/durable_s3_crash_reopen.sh
      - test/durable_fault_acceptance.sh
      - test/durable_aspect_smoke.sh
      - test/durable_s3_aspect_smoke.sh
      - test/durable-aspect-published/deps.edn
      - test/durable-fault/deps.edn
      - test/durable-fault-published/deps.edn
      - test/durable-process-published/deps.edn
      - test/oscope/durable_crash_verify.clj
      - test/oscope/durable_fault_report_verify.clj
      - test/oscope/durable_fault_server_main.clj
      - test/oscope/durable_fault_verify.clj
      - test/oscope/durable_aspect_test_runner.clj
      - test/oscope/durable_aspect_report_test.clj
      - test/oscope/durable_history_assertions.clj
      - test/oscope/durable_history_assertions_test.clj
      - test/oscope/durable_integration_test.clj
      - test/oscope/durable_s3_aspect_test_runner.clj
      - test/oscope/durable_telemetry_assertions.clj
      - test/oscope/durable_observability_test.clj
      - test/oscope/durable_s3_integration_test.clj
      - test/oscope/durable_test_runner.clj
      - test/oscope/embedded_durable_integration_test.clj
      - test/oscope/embedded_query_test.clj
      - test/oscope/embedded_test.clj
      - test/oscope/server_test.clj

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.3
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.3
      MINIO_IMAGE: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical chDB native qualification
        uses: actions/checkout@v4
        with:
          repository: chucklehead-dev/jolt-chdb
          ref: 5d17703098a73675ade8cc94aff721b6bce61e14
          path: .qualification/jolt-chdb
          persist-credentials: false
      - name: Checkout canonical Durable aspect pack
        uses: actions/checkout@v4
        with:
          repository: chucklehead-dev/jolt-aspect-packs
          ref: 3280fefd5b7e98cf4dee54b63b6b8156c6abe4d4
          path: .qualification/jolt-aspect-packs
          persist-credentials: false
      - name: Checkout aspect-capable Jolt compiler
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: 5d56b9e5d295fe0968df07e535c45353050611f7
          path: .qualification/jolt
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install Jolt v0.8.3
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.3/install \
            | bash -s -- --dir "$install_dir" --version 0.8.3
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        run: test "$(jolt --version)" = "jolt v0.8.3"
      - name: Install aspect compiler linker dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uuid-dev
      - name: Provision pinned Chez for the aspect compiler
        run: make -C .qualification/jolt deps JOLT_SYSTEM_CHEZ=
      - name: Assert aspect compiler version
        run: >-
          test "$(.qualification/jolt/bin/jolt --version)"
          = "jolt v0.8.3-41-g5d56b9e5"
      - name: Qualify pinned Durable native ABI and asset
        working-directory: .qualification/jolt-chdb
        run: scripts/qualify-durable-native.sh "$RUNNER_TEMP/chdb-durable"
      - name: Test direct in-process Durable SDK and oscope composition
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
        run: jolt -M:test-durable
      - name: Validate renewal-before-release through local woven history
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          JOLT_ASPECT_JOLT: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          JOLT_BIN: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          OSCOPE_DURABLE_ASPECT_BUILD_ALIAS: published
        run: test/durable_aspect_smoke.sh
      - name: Recover oscope through pinned MinIO
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          OSCOPE_DURABLE_S3_TEST_ALIAS: test-durable-s3
        run: test/durable_s3_minio.sh
      - name: Validate ordered privacy-safe Durable history through pinned MinIO
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          JOLT_ASPECT_JOLT: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          JOLT_BIN: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          OSCOPE_DURABLE_ASPECT_BUILD_ALIAS: published
        run: test/durable_s3_aspect_smoke.sh
      - name: Recover oscope after process crashes through pinned MinIO
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          JOLT_BIN: jolt
          OSCOPE_DURABLE_CRASH_BUILD_ALIAS: test-durable-s3
        run: test/durable_s3_crash_reopen.sh
      - name: Reject definite and ambiguous Durable acknowledgements
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb-durable/native/libchdb.so
          JOLT_ASPECT_JOLT: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          JOLT_BIN: ${{ github.workspace }}/.qualification/jolt/bin/jolt
          OSCOPE_DURABLE_FAULT_BUILD_ALIAS: published
        run: test/durable_fault_acceptance.sh

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-check:
    name: Typed Clojure pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
      - name: Check pure contracts, valid consumer, and mutation controls
        run: clojure -M:typed-check

  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.6
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.6
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-native
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Durable-capable Jolt runtime
        uses: actions/checkout@v4
        with:
          repository: casselc/jolt
          ref: 2d39e854a90926d8f8e9bd5d3ddbb109d657afe1
          path: .qualification/jolt
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install Jolt v0.8.6
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.6/install \
            | bash -s -- --dir "$install_dir" --version 0.8.6
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        shell: bash
        run: test "$(jolt --version)" = "jolt v0.8.6"
      - name: Provision pinned Chez for the Durable-capable runtime
        run: make -C .qualification/jolt deps JOLT_SYSTEM_CHEZ=
      - name: Assert Durable-capable Jolt version
        run: >-
          test "$(.qualification/jolt/bin/jolt --version)"
          = "jolt v0.8.6-7-g2d39e854"
      - name: Install checksum-pinned minimal-profile chDB asset
        working-directory: test/fixtures/minimal-embedded-app
        env:
          JOLT_CHDB_CACHE_DIR: ${{ runner.temp }}/chdb-native
        run: >-
          ${{ github.workspace }}/.qualification/jolt/bin/jolt
          -Srepro -M -m jdbc.chdb.install
      - name: Select qualified native fixture runtime
        shell: bash
        run: |
          echo "JOLT_BIN=$GITHUB_WORKSPACE/.qualification/jolt/bin/jolt" >> "$GITHUB_ENV"
          echo "JOLT_CHDB_LIB=$RUNNER_TEMP/chdb-native/libchdb.so" >> "$GITHUB_ENV"
      - name: Test strict Langfuse credential wrapper
        run: test/langfuse_interop_env_test.sh
      - name: Test protected manual Langfuse workflow
        run: test/langfuse_workflow_test.sh
      - name: Install native property-test dependency
        run: jolt -Srepro -A:test-headless -m hegel.install
      - name: Headless tests
        run: jolt -Srepro -M:test-headless

  browser:
    name: Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.6
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Jolt v0.8.6
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.6/install \
            | bash -s -- --dir "$install_dir" --version 0.8.6
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        shell: bash
        run: test "$(jolt --version)" = "jolt v0.8.6"
      - name: Install checksum-pinned chDB asset
        run: jolt -Srepro -M -m jdbc.chdb.install
      - name: Qualify typed direct and loopback socket ingestion
        env:
          JOLT_TEST_CHILD_EXECUTABLE: ${{ runner.temp }}/jolt-bin/jolt
        run: jolt -Srepro -M:test-typed-socket
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:browser

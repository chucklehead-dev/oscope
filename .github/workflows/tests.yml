name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-check:
    name: Typed Clojure pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
      - name: Check pure contracts, valid consumer, and mutation controls
        run: clojure -M:typed-check

  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.3
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.3
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-native
    steps:
      - uses: actions/checkout@v4
      - name: Install Jolt v0.8.3
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/v0.8.3/install \
            | bash -s -- --dir "$install_dir" --version 0.8.3
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        shell: bash
        run: test "$(jolt --version)" = "jolt v0.8.3"
      - name: Install native property-test dependency
        run: jolt -Srepro -A:test-headless -m hegel.install
      - name: Headless tests
        run: jolt -Srepro -M:test-headless

name: langfuse-interop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: langfuse-interop
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-durable-bcb376a0
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-durable-bcb376a0
      # Exact green plain-runtime producer; woven lanes remain separate.
      JOLT_AOT_CACHE: '0'
      JOLT_NO_USER_DEPS: '1'
      QUALIFIED_RUNTIME_PROFILE: bcb
      QUALIFIED_RUNTIME_REPOSITORY: casselc/jolt
      QUALIFIED_RUNTIME_COMPILER_SOURCE: bcb376a04f8e3d4508e9f77f4fa33b50bae7924b
      QUALIFIED_RUNTIME_COMPILER_TREE: eb24fdfdba7da4e468304376e37db3117b3c50b9
      QUALIFIED_RUNTIME_RUN_ID: '37650983199'
      QUALIFIED_RUNTIME_RUN_ATTEMPT: '1'
      QUALIFIED_RUNTIME_ARTIFACT_ID: '11497896255'
      QUALIFIED_RUNTIME_WORKFLOW_SHA: '2d0f4b59e068b269780b0a669e8bc06524ec98b1'
      QUALIFIED_RUNTIME_ARTIFACT_SHA256: '6d7043b502ab7839fe4a91ae977b7be8be088ebe620ead6115d2d0afdb9819db'
      QUALIFIED_RUNTIME_BINARY_SHA256: '9f6e6b4a347ae006ba5810b3bb876b4bb2eca41b611afeadfb18d4feb9c03cf0'
      QUALIFIED_RUNTIME_HELPER_SOURCE: https://raw.githubusercontent.com/chucklehead-dev/jolt-otel-clickhouse/c9916a8e66c924120f225c3889c1dda8dcab7655/scripts/fetch-qualified-durable-runtime.sh
      QUALIFIED_RUNTIME_HELPER_SHA256: a20b0e9dc54446172a15d83cec64fd11039af659f54c8997cbeab533c607ff65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout canonical chDB native qualification
        uses: actions/checkout@v4
        with:
          repository: chucklehead-dev/jolt-chdb
          ref: 3e3141fd29b335aa7bf2b6039fed7b3bbb4ebe04
          path: .qualification/jolt-chdb
          persist-credentials: false
      - name: Authenticate and select qualified positive runtime
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/fetch-qualified-durable-runtime.sh"
          curl -fsSL --connect-timeout 15 --max-time 30 "$QUALIFIED_RUNTIME_HELPER_SOURCE" -o "$helper"
          printf '%s  %s\n' "$QUALIFIED_RUNTIME_HELPER_SHA256" "$helper" | sha256sum -c -
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 240s bash "$helper" \
            | tee "$RUNNER_TEMP/oscope-qualified-runtime.log"
          test "$(grep -c '^QUALIFIED_RUNTIME_BIN=' "$RUNNER_TEMP/oscope-qualified-runtime.log")" = 1
          QUALIFIED_RUNTIME_BIN=$(sed -n 's/^QUALIFIED_RUNTIME_BIN=//p' "$RUNNER_TEMP/oscope-qualified-runtime.log")
          [[ "$QUALIFIED_RUNTIME_BIN" =~ ^/tmp/qualified-durable-runtime\.[A-Za-z0-9]+/jolt$ ]]
          test -f "$QUALIFIED_RUNTIME_BIN" && test ! -L "$QUALIFIED_RUNTIME_BIN"
          test "$(realpath "$QUALIFIED_RUNTIME_BIN")" = "$QUALIFIED_RUNTIME_BIN"
          test "$(sha256sum "$QUALIFIED_RUNTIME_BIN" | cut -d ' ' -f1)" = "$QUALIFIED_RUNTIME_BINARY_SHA256"
          (cd "$(dirname "$QUALIFIED_RUNTIME_BIN")" && "$QUALIFIED_RUNTIME_BIN" -Srepro -e \
            '(require (quote jolt.host)) (assert (= "Chez Scheme Version 10.4.1" (jolt.host/scheme-version)))')
          # This plain lane's qualifier/SDK/native children use this artifact.
          # There is no bootstrap compiler or woven step in this workflow.
          echo "JOLT_BIN=$QUALIFIED_RUNTIME_BIN" >> "$GITHUB_ENV"
          echo "JOLT_WRAPPER=" >> "$GITHUB_ENV"
          dirname "$QUALIFIED_RUNTIME_BIN" >> "$GITHUB_PATH"
      - name: Qualify pinned chDB native ABI and asset
        working-directory: .qualification/jolt-chdb
        run: scripts/qualify-durable-native.sh "$RUNNER_TEMP/chdb"
      - name: Qualify Oscope and Langfuse interoperability
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb/native/libchdb.so
          OSCOPE_LANGFUSE_BASE_URL: ${{ vars.OSCOPE_LANGFUSE_BASE_URL }}
          OSCOPE_LANGFUSE_PUBLIC_KEY: ${{ secrets.OSCOPE_LANGFUSE_PUBLIC_KEY }}
          OSCOPE_LANGFUSE_SECRET_KEY: ${{ secrets.OSCOPE_LANGFUSE_SECRET_KEY }}
        run: test/langfuse_interop_env.sh

name: langfuse-interop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: langfuse-interop
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.8.6
      JOLT_GITLIBS_DIR: ${{ github.workspace }}/.jolt-gitlibs-v0.8.6
      # Authenticated producer83 tuple; rotate explicitly before artifact expiry.
      QUALIFIED_RUNTIME_REPOSITORY: casselc/jolt
      QUALIFIED_RUNTIME_COMPILER_SOURCE: aea91781bbab68bf174fef4a689bb00dcf834ded
      QUALIFIED_RUNTIME_COMPILER_TREE: a31de1596fcabd0e45fbcbc528842805acea0ee7
      QUALIFIED_RUNTIME_RUN_ID: '35188849252'
      QUALIFIED_RUNTIME_RUN_ATTEMPT: '1'
      QUALIFIED_RUNTIME_ARTIFACT_ID: '10483062488'
      QUALIFIED_RUNTIME_WORKFLOW_SHA: '6bf745bf6101f2c3481d0ffe16401843c7675050'
      QUALIFIED_RUNTIME_ARTIFACT_SHA256: '353670dda1447d96d46aa1e133e4910481caf2f328d159a9bde76ed863e41524'
      QUALIFIED_RUNTIME_BINARY_SHA256: '31cff7ea89a652bd99848cf15686eb576d90d9ac3962ac07701fb6005e6eb458'
      QUALIFIED_RUNTIME_HELPER_SOURCE: https://raw.githubusercontent.com/chucklehead-dev/jolt-otel-clickhouse/c26c9bfcf071112531974729b15469b8c9fe713a/scripts/fetch-qualified-durable-runtime.sh
      QUALIFIED_RUNTIME_HELPER_SHA256: e962976aea263f00440fdf9bfa53c36a158c501f2b87d15aa8a84867fe51caae
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout canonical chDB native qualification
        uses: actions/checkout@v4
        with:
          repository: chucklehead-dev/jolt-chdb
          ref: 19e0ecf9e9f5e2c3f24ac8758f5d6953fd021774
          path: .qualification/jolt-chdb
          persist-credentials: false
      - name: Install Jolt v0.8.6
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL \
            https://raw.githubusercontent.com/jolt-lang/jolt/f3041a0e32ba0db1b92bd69b8ecb7b40f8b2e115/install \
            | bash -s -- --dir "$install_dir" --version 0.8.6 \
              --checksum 3dab6373f2028efaf7a0e41231fc316de866e55454023c037e9d5981be6358c2
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Assert Jolt version
        shell: bash
        run: test "$(jolt --version)" = "jolt v0.8.6"
      - name: Authenticate and select qualified positive runtime
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/fetch-qualified-durable-runtime.sh"
          curl -fsSL --connect-timeout 15 --max-time 30 "$QUALIFIED_RUNTIME_HELPER_SOURCE" -o "$helper"
          printf '%s  %s\n' "$QUALIFIED_RUNTIME_HELPER_SHA256" "$helper" | sha256sum -c -
          TMPDIR=/tmp timeout --signal=TERM --kill-after=5s 120s bash "$helper" \
            | tee "$RUNNER_TEMP/oscope-qualified-runtime.log"
          test "$(grep -c '^QUALIFIED_RUNTIME_BIN=' "$RUNNER_TEMP/oscope-qualified-runtime.log")" = 1
          QUALIFIED_RUNTIME_BIN=$(sed -n 's/^QUALIFIED_RUNTIME_BIN=//p' "$RUNNER_TEMP/oscope-qualified-runtime.log")
          [[ "$QUALIFIED_RUNTIME_BIN" =~ ^/tmp/qualified-durable-runtime\.[A-Za-z0-9]+/jolt$ ]]
          test -f "$QUALIFIED_RUNTIME_BIN" && test ! -L "$QUALIFIED_RUNTIME_BIN"
          test "$(realpath "$QUALIFIED_RUNTIME_BIN")" = "$QUALIFIED_RUNTIME_BIN"
          test "$(sha256sum "$QUALIFIED_RUNTIME_BIN" | cut -d ' ' -f1)" = "$QUALIFIED_RUNTIME_BINARY_SHA256"
          # Positive qualifier/SDK/native children use this exact artifact.
          # Woven steps retain their explicit f00 compiler override.
          echo "JOLT_BIN=$QUALIFIED_RUNTIME_BIN" >> "$GITHUB_ENV"
          echo "JOLT_WRAPPER=" >> "$GITHUB_ENV"
          echo "JOLT_CACHE_DIR=$GITHUB_WORKSPACE/.jolt-cache-durable-aea" >> "$GITHUB_ENV"
          dirname "$QUALIFIED_RUNTIME_BIN" >> "$GITHUB_PATH"
      - name: Qualify pinned chDB native ABI and asset
        working-directory: .qualification/jolt-chdb
        run: scripts/qualify-durable-native.sh "$RUNNER_TEMP/chdb"
      - name: Qualify Oscope and Langfuse interoperability
        env:
          JOLT_CHDB_LIB: ${{ runner.temp }}/chdb/native/libchdb.so
          OSCOPE_LANGFUSE_BASE_URL: ${{ vars.OSCOPE_LANGFUSE_BASE_URL }}
          OSCOPE_LANGFUSE_PUBLIC_KEY: ${{ secrets.OSCOPE_LANGFUSE_PUBLIC_KEY }}
          OSCOPE_LANGFUSE_SECRET_KEY: ${{ secrets.OSCOPE_LANGFUSE_SECRET_KEY }}
        run: test/langfuse_interop_env.sh

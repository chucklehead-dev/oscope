[package]
name = "oscope-core"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
itoa = "1"
ryu = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
panic = "abort"

[package]
name = "oscope-server"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "oscope"
path = "src/main.rs"

[[bin]]
name = "oscope-tui"
path = "src/tui.rs"

[dependencies]
oscope-core = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2", features = ["json"] }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oscope</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <span class="brand"><i></i>oscope</span>
  <nav class="tabs" aria-label="Sections">
    <a href="#/search" data-tab="search">Search</a>
    <a href="#/services" data-tab="services">Services</a>
  </nav>
  <span class="spacer"></span>
  <div class="range" role="group" aria-label="Time range" data-testid="range">
    <button data-range="5m">5m</button>
    <button data-range="15m">15m</button>
    <button data-range="1h">1h</button>
    <button data-range="6h">6h</button>
    <button data-range="24h">24h</button>
  </div>
  <button class="live" data-testid="live" aria-pressed="false" title="Refresh every 3 s"><i></i>Live</button>
</header>
<main id="view"></main>
<aside id="drawer" hidden data-testid="drawer"></aside>
<script src="/app.js"></script>
</body>
</html>
